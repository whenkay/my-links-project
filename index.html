<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Wendy Klare - personal links page for portfolio, LinkedIn, and email."
    />
    <title>Wendy Klare | Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="profile-card" aria-label="Personal links card">
        <div class="avatar" aria-label="Profile photo placeholder">
          <span>WK</span>
        </div>

        <h1 class="name">Wendy Klare</h1>
        <p class="bio">
          Designer, storyteller, and creative thinker building meaningful visual
          experiences.
        </p>

        <nav class="link-list" aria-label="Links">
          <a
            class="link-button"
            href="http://www.purposestudio.com"
            target="_blank"
            rel="noreferrer"
          >
            <span class="icon-wrap" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true">
                <path d="M8.5 8.5A2.5 2.5 0 1 1 13 8.5a2.5 2.5 0 0 1-4.5 0zm-2 8.5V13.5c0-1.1.9-2 2-2h5c1.1 0 2 .9 2 2v3.5M3 18.5h18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="link-label">Portfolio</span>
          </a>

          <a
            class="link-button"
            href="https://linkedin.com/in/wendyklare"
            target="_blank"
            rel="noreferrer"
          >
            <span class="icon-wrap" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true">
                <path d="M7.5 9.5V17M7.5 6.5v.01M11 17v-5.5c0-1.4.9-2.5 2.3-2.5 1.4 0 2.2 1.1 2.2 2.5V17M4 17h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="link-label">LinkedIn</span>
          </a>

          <a class="link-button" href="mailto:wendy@purposestudio.com">
            <span class="icon-wrap" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true">
                <path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h12a2.5 2.5 0 0 1 2.5 2.5v9A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5v-9zm0 0 8.5 6.5 8.5-6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="link-label">Email</span>
          </a>
        </nav>

        <footer class="footer">Design is Life</footer>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
